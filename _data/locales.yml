# Locales in language-switcher order. `code` is used as the <html lang> value,
# as the key into _data/i18n.yml, and as the privacy-policy file name.
#
# `match` lists extra BCP 47 tags that should resolve to this locale when the
# home page reads the visitor's browser languages. The lowercased `code` always
# matches, and matching falls back to shorter prefixes (`de-AT` finds `de`), so
# `match` is only needed where the tag and the code differ: the Chinese scripts
# have their own region codes, and Portuguese ships only in its Brazilian form.
- code: en
  name: English
  path: /
- code: ja
  name: 日本語
  path: /ja/
- code: ko
  name: 한국어
  path: /ko/
- code: zh-Hans
  name: 简体中文
  path: /zh-Hans/
  # Bare `zh` lands here, so it must not be listed under zh-Hant as well.
  match: [zh-cn, zh-sg, zh]
- code: zh-Hant
  name: 繁體中文
  path: /zh-Hant/
  match: [zh-tw, zh-hk, zh-mo]
- code: de
  name: Deutsch
  path: /de/
- code: es
  name: Español
  path: /es/
- code: fr
  name: Français
  path: /fr/
- code: it
  name: Italiano
  path: /it/
- code: nl
  name: Nederlands
  path: /nl/
- code: pt-BR
  name: Português (BR)
  path: /pt-BR/
  match: [pt]
- code: ru
  name: Русский
  path: /ru/
- code: tr
  name: Türkçe
  path: /tr/
