en:
  tagline: Harmolo makes apps that bring a little more to your music and everyday life.
  apps_heading: Apps
  language_label: Language
  email_label: Email
  privacy_link: Privacy policy
  back_to_home: Back to home
  stores:
    ios: App Store
    android: Google Play
    web: Web
  apps:
    vocaltuner: A tuner that draws your singing pitch as a real-time trail.
    folino: A sheet-music viewer and player that also organizes your scores.
    chord_memo: A simple memo app for jotting down and organizing chord progressions.
    synced_metronome: A metronome that plays in sync across multiple devices.
    seclock: A clock widget that shows the seconds.

