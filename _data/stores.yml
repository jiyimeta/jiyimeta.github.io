# Per-locale store routing for the App Store and Google Play links.
#
# `apps.yml` holds one canonical URL per app - a `/us/` App Store URL and a bare
# Play URL - and `_includes/app-card.html` rewrites it with the values below so
# each translated page links to a store page in its own language.
#
# `apple` replaces the country segment of the App Store URL. The App Store picks
# the page language from the storefront, not from a language parameter, so the
# country code is what does the localizing. `apple_lang` adds `?l=` on top, and
# is only needed for Turkey, whose storefront serves English by default.
#
# `play` is the Google Play `hl` value. Play treats it as a pure language
# switch, independent of the storefront country, so no availability caveats
# apply there.

en:      { apple: us, play: en }
ja:      { apple: jp, play: ja }
ko:      { apple: kr, play: ko }
zh-Hans: { apple: cn, play: zh-CN }
zh-Hant: { apple: tw, play: zh-TW }
de:      { apple: de, play: de }
es:      { apple: es, play: es }
fr:      { apple: fr, play: fr }
it:      { apple: it, play: it }
nl:      { apple: nl, play: nl }
pt-BR:   { apple: br, play: pt-BR }
ru:      { apple: ru, play: ru }
tr:      { apple: tr, apple_lang: tr, play: tr }
